version: '3.8'

services:
  payload:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - postgres
    environment:
      PAYLOAD_DATABASE_PUSH: 'false'

  postgres:
    restart: always
    image: postgres:17
    environment:
      POSTGRES_USER: coachpass
      POSTGRES_PASSWORD: coachpass
      POSTGRES_DB: coachpass
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5433:5432'

volumes:
  pgdata:
